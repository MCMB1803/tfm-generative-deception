# Generative Deception Framework - TFM UCM
#
# Topologia: el senuelo SSH es el unico servicio publicado al exterior.
# El orquestador y el motor de inferencia viven solo en la red interna
# `deception-net` y no son alcanzables desde la red del atacante.

networks:
  deception-net:
    driver: bridge

volumes:
  ollama_data:
  agent_data:
  decoy_data:

services:
  # --- Motor de inferencia local -------------------------------------------
  ollama-llm:
    image: ollama/ollama:latest
    container_name: ollama_llm
    # Publicado solo en loopback: necesario para el benchmark desde el host,
    # nunca expuesto a la red externa.
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - deception-net
    environment:
      # Mantiene el modelo residente: evita recargas de varios segundos que
      # dispararian la latencia por encima del objetivo de 1000 ms.
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_NUM_PARALLEL: "2"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # --- Descarga del modelo (job de un solo uso) ----------------------------
  model-puller:
    image: ollama/ollama:latest
    container_name: ollama_model_puller
    depends_on:
      ollama-llm:
        condition: service_healthy
    networks:
      - deception-net
    environment:
      OLLAMA_HOST: "http://ollama-llm:11434"
      MODEL_NAME: "${MODEL_NAME:-qwen2.5-coder:0.5b}"
    entrypoint: ["/bin/sh", "-c"]
    command: >
      'echo "Descargando ${MODEL_NAME:-qwen2.5-coder:0.5b}..." &&
       ollama pull "${MODEL_NAME:-qwen2.5-coder:0.5b}" &&
       echo "Modelo listo."'
    restart: "no"

  # --- Orquestador multi-agente --------------------------------------------
  deception-agent:
    build: ./agents
    container_name: deception_agent
    depends_on:
      model-puller:
        condition: service_completed_successfully
    networks:
      - deception-net
    # Publicado solo en loopback del host para que el benchmark pueda medir
    # la API. Nunca accesible desde la red del atacante.
    ports:
      - "127.0.0.1:${AGENT_API_PORT:-8000}:8000"
    volumes:
      - agent_data:/app/data
    environment:
      OLLAMA_HOST: "http://ollama-llm:11434"
      MODEL_NAME: "${MODEL_NAME:-qwen2.5-coder:0.5b}"
      LATENCY_TARGET_MS: "${LATENCY_TARGET_MS:-1000}"
      SESSION_CONTEXT_TURNS: "${SESSION_CONTEXT_TURNS:-6}"
      MAX_TOKENS: "${MAX_TOKENS:-64}"
      PERSONA_SEED: "${PERSONA_SEED:-1803}"
      LATENCY_NORMALIZE: "${LATENCY_NORMALIZE:-true}"
      LATENCY_RTT_MEDIAN_MS: "${LATENCY_RTT_MEDIAN_MS:-700}"
      LATENCY_RTT_SIGMA: "${LATENCY_RTT_SIGMA:-0.25}"
      LATENCY_TAIL_CAP: "${LATENCY_TAIL_CAP:-6}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    healthcheck:
      test: ["CMD-SHELL",
             "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # --- Senuelo SSH (unico servicio expuesto) -------------------------------
  ssh-decoy:
    build: ./decoys/ssh
    container_name: honeypot_ssh
    depends_on:
      deception-agent:
        condition: service_healthy
    ports:
      - "${DECOY_SSH_PORT:-2222}:2222"
    networks:
      - deception-net
    volumes:
      - decoy_data:/app/data
    environment:
      AGENT_API: "http://deception-agent:8000"
      # Puerto no privilegiado: permite cap_drop ALL sin CAP_NET_BIND_SERVICE.
      LISTEN_PORT: "2222"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    # Contencion: el senuelo es el componente expuesto, asi que corre sin
    # capacidades adicionales y con el sistema de ficheros en solo lectura
    # salvo el volumen de datos.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # --- SIEM: manager de Wazuh ----------------------------------------------
  # Bajo el perfil "siem" para que la pila base siga siendo ligera:
  #     docker compose --profile siem up -d
  # El manager monta las reglas del framework y el directorio de eventos, de
  # modo que puede analizarlas directamente sin desplegar un agente aparte.
  wazuh-manager:
    image: wazuh/wazuh-manager:4.9.2
    container_name: wazuh_manager
    profiles: ["siem"]
    hostname: wazuh-manager
    networks:
      - deception-net
    ports:
      - "127.0.0.1:1514:1514/udp"
      - "127.0.0.1:55000:55000"
    environment:
      # Sin indexer ni dashboard: la validacion de las reglas se hace con
      # wazuh-logtest, que es reproducible y deja evidencia en texto. Filebeat
      # arranca igualmente y no encuentra el indexer, lo cual es esperado y no
      # afecta al motor de analisis, que es lo que aqui se valida.
      FILEBEAT_SSL_VERIFICATION_MODE: "none"
    volumes:
      # Las reglas NO se montan dentro de /var/ossec/etc: un bind mount ahi
      # impide que el contenedor instale su configuracion por defecto en el
      # primer arranque y el manager se queda sin ossec.conf. Se dejan en una
      # ruta neutra y las instala siem/validate_rules.py --install.
      - ./siem/wazuh:/deception-rules:ro
      - agent_data:/deception:ro
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 655360, hard: 655360}
    restart: unless-stopped
