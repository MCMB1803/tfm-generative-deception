version: '3.8'

networks:
  deception-net:
    driver: bridge

services:
  ollama-llm:
    image: ollama/ollama:latest
    container_name: ollama_llm
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - deception-net
    restart: unless-stopped

  ssh-decoy:
    build: ./decoys/ssh
    container_name: honeypot_ssh
    ports:
      - "2222:22"
    depends_on:
      - ollama-llm
    networks:
      - deception-net
    restart: unless-stopped

volumes:
  ollama_data: