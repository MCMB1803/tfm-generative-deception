version: '3.8'

networks:
  deception-net:
    driver: bridge

services:
  ollama-llm:
    image: ollama/ollama:latest
    container_name: ollama_llm
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - deception-net
    restart: unless-stopped

  deception-agent:
    build: ./agents
    container_name: python_agent
    environment:
      - OLLAMA_HOST=http://ollama-llm:11434
    depends_on:
      - ollama-llm
    networks:
      - deception-net
    restart: unless-stopped

volumes:
  ollama_data: